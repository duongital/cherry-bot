name: Deploy client

on:
  push:
    branches: [main]
    paths:
      - "apps/client/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-client.yml"
  workflow_dispatch:

concurrency:
  group: deploy-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        working-directory: apps/client
        run: |
          set -euo pipefail

          # Keep the client pointed at the same API as the Worker. Using
          # wrangler.toml as the single source of truth prevents a stale
          # repository variable from shipping a build with the wrong host.
          VITE_BETTER_AUTH_URL="$(sed -n 's/^BETTER_AUTH_URL[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' ../server/wrangler.toml | head -n 1)"
          if [ -z "$VITE_BETTER_AUTH_URL" ]; then
            echo "::error::Could not read BETTER_AUTH_URL from apps/server/wrangler.toml"
            exit 1
          fi
          export VITE_BETTER_AUTH_URL
          echo "Building client with API URL: $VITE_BETTER_AUTH_URL"

          pnpm build

      - name: Ensure Pages project exists
        working-directory: apps/client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail

          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret or variable: $name"
              exit 1
            fi
          done

          output_file="$RUNNER_TEMP/pages-project-create.log"

          if pnpm exec wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT_NAME" \
               --production-branch=main 2>&1 | tee "$output_file"; then
            echo "Created Pages project: $CLOUDFLARE_PAGES_PROJECT_NAME"
          elif grep -qiE "already exists|already taken" "$output_file"; then
            echo "Pages project already exists: $CLOUDFLARE_PAGES_PROJECT_NAME"
          else
            echo "::error::Could not create or find Pages project: $CLOUDFLARE_PAGES_PROJECT_NAME"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        working-directory: apps/client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail

          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret or variable: $name"
              exit 1
            fi
          done

          pnpm exec wrangler pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$(git log -1 --pretty=%s)" \
            --commit-dirty=true
