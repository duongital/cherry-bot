name = "cherry-server"
main = "src/index.ts"
compatibility_date = "2025-02-04"
compatibility_flags = ["nodejs_compat"]

# Non-secret vars (safe to commit). Update with your real URLs after deploy.
[vars]
BETTER_AUTH_URL = "https://cherry-api.flipbee.app"
CLIENT_URL = "https://cherry.flipbee.app"
MOBILE_APP_SCHEME = "botcherry"
HOSTNAME = "cherry-api"

# Secrets: set locally in `.dev.vars` and in production via:
#   wrangler secret put BETTER_AUTH_SECRET
#   wrangler secret put DATABASE_URL

[observability.logs]
enabled = true
invocation_logs = true

# --- Tracing ---------------------------------------------------------------
# Uses Cloudflare's native Workers tracing. The runtime creates the request and
# platform spans (fetch/KV/D1) and exports them over OTLP/HTTP to the destinations
# named here.
#
# The destination "bot-cherry-traces" must exist in the Cloudflare dashboard:
#   Observability > Destinations > Add destination
#     type:      Traces
#     OTLP URL:  https://trace.duongital.com/insert/opentelemetry/v1/traces
#     headers:   (optional collector auth)
#
# `persist = false` keeps traces out of Cloudflare storage and sends them only
# to the destination (avoids future Cloudflare ingestion/storage billing).
[observability.traces]
enabled = true
destinations = ["bot-cherry-traces"]
head_sampling_rate = 1
persist = false
